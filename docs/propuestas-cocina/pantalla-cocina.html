<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pantalla de cocina — FoodTruckOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100F0D;--surface:#1B1917;--surface2:#232019;--edge:#332F29;
  --text:#F6F3ED;--dim:#9C948A;
  --amber:#F5A524;--red:#E5484D;--green:#30A46C;--blue:#5B8DEF;
  --f:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
.lab,.hud,.tabs{flex:none}

/* ---------- barra de prueba (no es parte del producto) ---------- */
.lab{background:#000;color:#D8D5D0;font:500 12px/1.4 var(--f);padding:7px 12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.lab b{color:#fff}
.lab button{background:#2A2723;color:#D8D5D0;border:0;border-radius:4px;padding:5px 10px;font:600 12px var(--f);cursor:pointer}
.lab button:hover{background:#3A342D}
.lab .sep{margin-left:auto;color:#6F675E}
.lab .cfg{color:#9C948A;border-left:1px solid #2A2723;padding-left:11px}
.lab .cfg input{width:46px;background:#2A2723;color:#fff;border:1px solid #3A342D;border-radius:4px;padding:4px 6px;font:700 12px var(--f)}
body.clean .lab{display:none}

/* ---------- encabezado operativo ---------- */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--edge)}
.who{font-size:15px;font-weight:700;letter-spacing:-.01em}
.who span{color:var(--dim);font-weight:600}
.conn{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;padding:6px 12px;border-radius:100px;background:var(--surface2)}
.conn .d{width:9px;height:9px;border-radius:50%;background:var(--green)}
.conn.off{background:#3A1E1F;color:#FFB3B5}
.conn.off .d{background:var(--red);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}
.tools{margin-left:auto;display:flex;gap:9px}
.tool{background:var(--surface2);color:var(--text);border:1px solid var(--edge);border-radius:8px;padding:11px 16px;font:700 14px var(--f);cursor:pointer;min-height:46px}
.tool:hover{background:#2C2823}
.tool:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tool.on{background:var(--surface2);border-color:var(--green);color:var(--green)}

/* ---------- tablero ---------- */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--edge);flex:1;min-height:0}
.col{background:var(--bg);display:flex;flex-direction:column;min-height:0}
.chead{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:2px solid var(--edge);flex:none}
.chead h2{font-size:15px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin:0}
.chead .n{background:var(--surface2);color:var(--text);border-radius:100px;padding:2px 11px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.col[data-s=lista] .chead h2,.col[data-s=lista] .chead .n{color:var(--green)}
.cards{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.cards::-webkit-scrollbar{width:8px}.cards::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}
.empty{color:#5E574F;font-size:14px;font-weight:600;text-align:center;padding:26px 12px;line-height:1.5}

/* ---------- tarjeta de orden ---------- */
.card{background:var(--surface);border:1px solid var(--edge);border-left:6px solid var(--edge);border-radius:10px;padding:13px 14px 14px;flex:none}
.card.amber{border-left-color:var(--amber)}
.card.red{border-left-color:var(--red)}
.card.green{border-left-color:var(--green)}
.card.nueva{border-left-color:var(--blue)}
.card.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:none;opacity:1}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.num{font-size:31px;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.age{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.card.amber .age{color:var(--amber)}
.card.red .age{color:var(--red)}
.card.green .age{color:var(--green)}
.back{margin-left:auto;background:none;border:1px solid var(--edge);color:var(--dim);border-radius:7px;width:40px;height:40px;font-size:17px;cursor:pointer;flex:none}
.back:hover{color:var(--text);border-color:var(--dim)}
.back:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.meta{font-size:13.5px;font-weight:600;color:var(--dim);margin-bottom:11px}
.meta .ch{color:var(--text);background:var(--surface2);border-radius:4px;padding:2px 7px;margin-left:7px;font-size:12px;letter-spacing:.04em}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.items li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.q{background:var(--surface2);border-radius:6px;min-width:34px;height:34px;display:grid;place-items:center;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.nm{font-size:20px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mod{font-size:13.5px;font-weight:800;border-radius:5px;padding:3px 9px;letter-spacing:.01em}
.mod.add{background:#1F2E22;color:#7EE2A8}
.mod.rm{background:#3A1E1F;color:#FF9EA1}
.note{margin-top:11px;background:var(--surface2);border-left:3px solid var(--amber);border-radius:0 6px 6px 0;padding:9px 11px;font-size:14.5px;font-weight:600;line-height:1.35}
.inota{display:block;margin-top:6px;color:#FFCB6B;font-size:14px;font-weight:700;line-height:1.3}
.tnota{color:#FFCB6B;font-size:12.5px;font-weight:700;margin-top:5px;line-height:1.3}
/* por cobrar: aviso sin importe en cocina, con importe solo al entregar */
.unpaid{display:inline-flex;align-items:center;gap:6px;background:#3A2A12;color:#FFCB6B;border:1px solid #6B4A12;border-radius:5px;padding:4px 10px;font-size:13px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}
.pay{margin-top:12px;background:var(--amber);color:#231602;border-radius:8px;padding:14px 16px;font-size:24px;font-weight:900;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.01em}
.pay small{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.72}
.pay.paid{background:#16301F;color:#8BE9B0;border:1px solid #245C3C}
.pay.paid small{opacity:.8}

/* ventas del día: detrás de un toque, nunca encima del tablero */
.cnt{font-size:13.5px;font-weight:700;color:var(--dim);background:var(--surface2);border-radius:100px;padding:6px 12px}
.cnt b{color:var(--text)}
.day{position:fixed;inset:0;z-index:88;background:rgba(8,7,6,.8);display:none;place-items:center;padding:20px}
.day.on{display:grid}
.daybox{background:var(--surface);border:1px solid var(--edge);border-radius:16px;padding:24px;max-width:520px;width:100%}
.daybox .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
.daybox h3{font-size:22px;font-weight:900;letter-spacing:-.02em;margin:0}
.daybox .hd span{font-size:13px;color:var(--dim);font-weight:600;margin-left:auto}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--edge);border:1px solid var(--edge);border-radius:11px;overflow:hidden}
.nums div{background:var(--surface2);padding:15px 16px}
.nums b{display:block;font-size:29px;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.nums span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.nums .warn b{color:var(--amber)}
.dtop{margin-top:18px}
.dtop h4{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.dtop .p{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--edge);font-size:15px;font-weight:700}
.dtop .p:last-child{border-bottom:0}
.dtop .p em{font-style:normal;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.daybox .close{width:100%;margin-top:20px;border:0;border-radius:9px;background:var(--surface2);color:var(--text);padding:15px;font:800 16px var(--f);cursor:pointer;min-height:54px}
.daybox .close:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.daybox .disc{font-size:12px;color:#6F675E;margin:14px 0 0;line-height:1.5}

/* confirmación de cobro al entregar */
.ask{position:fixed;inset:0;z-index:90;background:rgba(8,7,6,.78);display:none;place-items:center;padding:20px}
.ask.on{display:grid}
.askbox{background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:24px;max-width:420px;width:100%}
.askbox .h{font-size:15px;font-weight:800;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.askbox h3{font-size:30px;font-weight:900;margin:8px 0 0;letter-spacing:-.02em;line-height:1.1}
.askbox .amt{font-size:44px;font-weight:900;color:var(--amber);margin:12px 0 20px;letter-spacing:-.03em}
.askbox>button{width:100%;border:0;border-radius:9px;padding:17px;font:900 17px var(--f);cursor:pointer;margin-bottom:9px;min-height:58px}
.askbox .opt{width:auto;border:2px solid var(--edge);background:var(--surface2);color:var(--text);border-radius:8px;
  padding:11px 15px;font:700 14.5px var(--f);cursor:pointer;min-height:46px;margin:0}
.askbox .opt[aria-pressed=true]{border-color:var(--blue);background:#16253F;color:#BBD4FF}
.askbox .opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.askbox .yes{background:var(--green);color:#04200F}
.askbox .no{background:var(--surface2);color:#FFCB6B;border:1px solid #6B4A12}
.askbox .cancel{background:none;color:var(--dim);font-weight:700;font-size:15px;min-height:44px;margin:0}
.askbox button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.go{width:100%;margin-top:12px;border:0;border-radius:8px;padding:16px;font:900 17px var(--f);letter-spacing:.03em;text-transform:uppercase;cursor:pointer;background:var(--surface2);color:var(--text);min-height:56px}
.go:hover{filter:brightness(1.18)}
.go:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.col[data-s=nueva] .go{background:var(--blue);color:#0A1020}
.col[data-s=prep] .go{background:var(--green);color:#04200F}
.col[data-s=lista] .go{background:var(--text);color:#12100E}

/* ---------- avisos ---------- */
.queue{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:50;background:#3A1E1F;color:#FFD9DA;border:1px solid #7A3033;border-radius:100px;padding:12px 22px;font-size:15px;font-weight:800;display:none}
.queue.on{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:52;background:var(--surface2);color:var(--text);border:1px solid var(--edge);border-radius:100px;padding:12px 22px;font-size:15px;font-weight:700;display:none}
.toast.on{display:block}

/* ---------- pantalla completa: agotados y captura ---------- */
.full{position:fixed;inset:0;z-index:86;background:var(--bg);display:none;flex-direction:column}
.full.on{display:flex}
.fhd{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--edge);flex:none;flex-wrap:wrap}
.fhd h2{font-size:19px;font-weight:900;letter-spacing:-.02em;margin:0}
.fhd p{font-size:13px;color:var(--dim);margin:2px 0 0;width:100%;order:9;font-weight:600}
.fx{margin-left:auto;background:var(--surface2);color:var(--text);border:1px solid var(--edge);border-radius:8px;
  padding:11px 18px;font:800 14px var(--f);cursor:pointer;min-height:46px}
.fx:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.fbody{flex:1;min-height:0;overflow:auto;padding:14px 18px 20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:11px 18px;background:var(--surface);border-bottom:1px solid var(--edge);flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--surface2);color:var(--dim);border:1px solid var(--edge);border-radius:100px;
  padding:9px 16px;font:800 13.5px var(--f);cursor:pointer;white-space:nowrap;min-height:42px}
.chips button[aria-current=true]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* agotados */
.arow{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--edge)}
.arow .nm{flex:1;min-width:0}
.arow .nm b{font-size:17px;font-weight:800;display:block}
.arow .nm span{font-size:13px;color:var(--dim)}
.arow.off .nm b{color:var(--sold);text-decoration:line-through}
.sw{position:relative;width:58px;height:34px;border-radius:100px;border:0;background:var(--green);cursor:pointer;flex:none;padding:0}
.sw[aria-checked=false]{background:#4A443C}
.sw i{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .14s}
.sw[aria-checked=true] i{transform:translateX(24px)}
.sw:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sw i{transition:none}}

/* captura */
.cap{display:grid;grid-template-columns:1fr 340px;gap:0;flex:1;min-height:0}
@media (max-width:820px){.cap{grid-template-columns:1fr}.capr{border-left:0!important;border-top:1px solid var(--edge)}}
.capl{overflow:auto;padding:14px 18px 20px;min-height:0}
.capr{background:var(--surface);border-left:1px solid var(--edge);display:flex;flex-direction:column;min-height:0}
.prods{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.p{background:var(--surface);border:1px solid var(--edge);border-radius:11px;padding:13px;cursor:pointer;text-align:left;
  color:var(--text);font:inherit;min-height:78px;display:flex;flex-direction:column;justify-content:space-between}
.p:hover{border-color:var(--dim)}
.p:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.p b{font-size:15px;font-weight:800;line-height:1.15}
.p span{font-size:14px;font-weight:800;color:var(--dim);margin-top:8px}
.p:disabled{opacity:.4;cursor:not-allowed}
.p:disabled b{text-decoration:line-through}
.p .pq{display:inline-block;background:var(--blue);color:#0A1020;border-radius:100px;padding:1px 9px;font-size:13px;font-weight:900;margin-left:6px;vertical-align:1px}
.tick{flex:1;overflow:auto;padding:12px 14px;min-height:0}
.tl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--edge)}
.tl .qn{background:var(--surface2);border-radius:6px;min-width:30px;height:30px;display:grid;place-items:center;font-size:15px;font-weight:900}
.tl .tn{font-size:15px;font-weight:700;line-height:1.2}
.tl .tm{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tl .tm span{font-size:11.5px;font-weight:800;border-radius:4px;padding:2px 7px}
.tl .tm .a{background:#1F2E22;color:#7EE2A8}
.tl .tm .r{background:#3A1E1F;color:#FF9EA1}
.tl .tb{display:flex;gap:5px;margin-top:6px}
.tl .tb button{background:none;border:1px solid var(--edge);color:var(--dim);border-radius:6px;padding:4px 9px;font:700 12px var(--f);cursor:pointer}
.tl .tb button:hover{color:var(--text);border-color:var(--dim)}
.tl .tp{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tempty{color:#5E574F;font-size:14px;font-weight:600;text-align:center;padding:34px 10px;line-height:1.5}
.capf{border-top:1px solid var(--edge);padding:13px 14px calc(13px + env(safe-area-inset-bottom));flex:none}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;font-weight:900;margin-bottom:11px}
.tot span:last-child{font-variant-numeric:tabular-nums}
.tot small{font-size:12.5px;font-weight:700;color:var(--dim);display:block}
.pay2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.pay2 button{border:2px solid var(--edge);background:var(--surface2);color:var(--text);border-radius:9px;padding:12px 8px;
  font:800 13.5px var(--f);cursor:pointer;min-height:50px}
.pay2 button[aria-pressed=true]{border-color:var(--green);background:#16301F;color:#8BE9B0}
/* notas: botones rápidos primero, escribir después, dictado como extra */
.notes{border-top:1px solid var(--edge);padding:12px 14px}
.notes .lb{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.notes .lb b{color:var(--text);font-weight:800}
.qchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.qchips button{background:var(--surface2);color:var(--text);border:1px solid var(--edge);border-radius:100px;
  padding:9px 14px;font:700 13.5px var(--f);cursor:pointer;min-height:42px}
.qchips button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#231602;font-weight:800}
.qchips button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.nwrap{position:relative}
.nwrap textarea{width:100%;background:var(--surface2);border:1px solid var(--edge);border-radius:9px;
  padding:11px 52px 11px 12px;font:600 14.5px var(--f);color:var(--text);min-height:52px;resize:vertical}
.nwrap textarea:focus-visible{outline:3px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.nwrap textarea::placeholder{color:#6F675E}
.mic{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);
  background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center;padding:0}
.mic svg{width:19px;height:19px}
.mic:hover{border-color:var(--dim)}
.mic:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mic.rec{background:var(--red);border-color:var(--red);color:#fff;animation:mp 1.1s infinite}
@keyframes mp{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
.mhint{font-size:12px;color:var(--dim);margin:7px 0 0;line-height:1.45}
.mhint.err{color:#FFB3B5}

.send{width:100%;border:0;border-radius:9px;background:var(--blue);color:#0A1020;padding:16px;font:900 17px var(--f);
  cursor:pointer;min-height:56px}
.send:disabled{background:var(--surface2);color:#5E574F;cursor:not-allowed}
.send:focus-visible{outline:3px solid #fff;outline-offset:2px}

@media (max-width:900px){
  .board{grid-template-columns:1fr}
  .col{display:none}.col.show{display:flex}
  .tabs{display:flex;gap:1px;background:var(--edge);flex:none}
  .tabs button{flex:1;background:var(--surface);color:var(--dim);border:0;padding:14px 8px;font:800 13px var(--f);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .tabs button[aria-current=true]{background:var(--bg);color:var(--text);box-shadow:inset 0 -3px 0 var(--blue)}
  .hud{gap:10px;padding:10px 14px}
  .tools{width:100%;margin-left:0;gap:7px}
  .tool{flex:1;padding:11px 6px;font-size:12.5px;text-align:center}
}
@media (min-width:901px){.tabs{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="lab">
  <b>Pantalla de cocina</b>
  <button id="simular">Entra pedido nuevo</button>
  <button id="revisarMenu">Revisar pedidos del menú</button>
  <button id="red">Cortar conexión</button>
  <button id="prisa">Adelantar 6 min</button>
  <button id="hide">Ocultar barra</button>
  <span class="cfg">Umbrales del dueño: ámbar <input id="uA" type="number" min="1" max="60" value="8">
    · rojo <input id="uR" type="number" min="2" max="90" value="15"> min</span>
  <span class="sep">Tablet de cocina · una orden avanza con un toque</span>
</div>

<header class="hud">
  <div class="who">Truck 1 <span>· Beto</span></div>
  <div class="conn" id="conn"><span class="d"></span><span id="connTxt">En línea</span></div>
  <div class="cnt"><b id="cntN">0</b> órdenes hoy</div>
  <div class="tools">
    <button class="tool" id="ventas">Ventas de hoy</button>
    <button class="tool" id="snd">Sonido activado</button>
    <button class="tool" id="agot">Marcar agotado</button>

<script>
/* ============ estado ============ */
const now=()=>Date.now(), M=60000;
let online=true, snd=true, offset=0, pending=0;
/* El folio de cualquier orden nueva (simulada o de ventanilla) sale del MISMO
   contador compartido que usa el menú del comensal, vía localStorage. Antes
   cocina tenía su propio contador fijo en 52 y el menú otro fijo en 48 — y
   como el menú siempre reinicia en 48 al recargar, y cocina ya trae un #48
   de muestra desde el arranque, el pedido real chocaba con el de ejemplo y
   se descartaba en silencio. Con un solo contador eso ya no puede pasar. */
function folioNuevo(){
  let n;
  try{n=parseInt(localStorage.getItem('ftFolio')||'100',10);if(!n||n<100)n=100}
  catch(e){n=100}
  try{localStorage.setItem('ftFolio',String(n+1))}catch(e){}
  return n;
}

/* Avisa a seguimiento.html (la pantalla del comensal) cuando cambia el estado
   de una orden que vino del QR. Mismo puente de localStorage que ya conecta
   menú → cocina, ahora en la otra dirección: cocina → comensal. Las órdenes
   de ventanilla no tienen a nadie del otro lado mirando, así que no se
   publican. */
const PASO_COMENSAL={nueva:'recibido',prep:'preparando',lista:'listo',entregada:'entregado'};
function publicarEstado(o,estadoCocina){
  if(o.canal!=='QR')return;
  const paso=PASO_COMENSAL[estadoCocina];if(!paso)return;
  try{
    const raw=localStorage.getItem('ftPedido_'+o.n);
    const snap=raw?JSON.parse(raw):{n:o.n,cliente:o.quien,sub:o.total,tax:0,items:[]};
    snap.s=paso;snap.pagado=o.pagado;
    localStorage.setItem('ftPedido_'+o.n,JSON.stringify(snap));
  }catch(e){}
}

/* Venta del turno. Se acumula por truck y por día — nunca desglosada por persona,
   para que esto no se convierta en medición de desempeño del personal. */
const DIA={ordenes:38,cobradas:38,venta:947.25,sinCobrar:0,platillos:{
  'Taco al pastor':112,'Taco de asada':86,'Quesabirria (3 pzas)':41,
  'Burrito de asada':28,'Agua de horchata':24,'Papas con queso':19}};

const ORD=[
 {n:47,canal:'QR',quien:'Jennifer',t:now()-14*M,s:'prep',pagado:true,total:12.50,items:[
   {q:3,nm:'Taco al pastor',add:['Queso'],rm:['Cebolla']},
   {q:1,nm:'Agua de horchata'}]},
 {n:48,canal:'Ventanilla',quien:'Mostrador',t:now()-9*M,s:'prep',pagado:true,total:24.00,items:[
   {q:2,nm:'Quesabirria (3 pzas)',add:['Doble carne']},
   {q:1,nm:'Consomé de birria'}],nota:'Los consomés aparte, se los lleva'},
 {n:49,canal:'QR',quien:'James',t:now()-4*M,s:'prep',pagado:false,total:18.75,items:[
   {q:1,nm:'Burrito de asada',rm:['Crema','Jalapeño']},
   {q:2,nm:'Taco de lengua'}],nota:'Más frijoles que arroz, por favor'},
 {n:50,canal:'QR',quien:'Marisol',t:now()-2*M,s:'nueva',pagado:false,total:9.25,items:[
   {q:1,nm:'Torta ahogada'},
   {q:1,nm:'Jarritos'}]},
 {n:51,canal:'Ventanilla',quien:'Mostrador',t:now()-1*M,s:'nueva',pagado:true,total:14.00,items:[
   {q:4,nm:'Taco de asada',rm:['Cilantro']},
   {q:1,nm:'Papas con queso',add:['Aguacate']}]},
 {n:46,canal:'QR',quien:'Luis',t:now()-19*M,s:'lista',pagado:false,total:11.00,items:[
   {q:1,nm:'Mulita de asada'},{q:1,nm:'Elote entero'}]},
 {n:45,canal:'Ventanilla',quien:'Mostrador',t:now()-22*M,s:'lista',pagado:true,total:7.00,items:[
   {q:2,nm:'Taco de nopal',add:['Salsa de la casa']}]}
];

/* El menú del truck. `ok:false` = se acabó: desaparece del menú del comensal
   y no se puede capturar en ventanilla. Es el mismo dato para las dos cosas. */
const EX=[['Queso',1],['Aguacate',1.5],['Doble carne',2.5],['Salsa de la casa',0]];
const QT=['Cebolla','Cilantro','Limón','Salsa'], QB=['Jalapeño','Aguacate','Frijoles','Crema'];
/* Atajos sobre los quitables. No son notas: escriben en la misma lista,
   así "con todo" y "sin picante" nunca pueden quedar marcados a la vez. */
const AT_T=[{t:'Con todo',q:[]},{t:'Sin verdura',q:['Cebolla','Cilantro']},{t:'Sin picante',q:['Salsa']}];
const AT_B=[{t:'Con todo',q:[]},{t:'Sin picante',q:['Jalapeño']}];
/* Notas rápidas por tipo de producto: a una horchata no se le pide "bien dorado". */
const NT_COMIDA=[{t:'Bien dorado'},{t:'Salsa aparte'},{t:'Poca salsa'},{t:'Extra caliente'}];
const NT_ANTOJO=[{t:'Poco chile'},{t:'Sin queso'},{t:'Sin crema'},{t:'Limón aparte'}];
const NT_BEBIDA=[{t:'Sin hielo'},{t:'Poco hielo'},{t:'Bien fría'},{t:'Sin azúcar'}];
const MENU=[
 {c:'Tacos',ex:EX,q:QT,at:AT_T,nt:NT_COMIDA,it:[
  {n:'Taco al pastor',p:3.25,ok:true},{n:'Taco de asada',p:3.50,ok:true},
  {n:'Taco de chorizo',p:3.00,ok:true},{n:'Taco de lengua',p:3.75,ok:true},
  {n:'Taco de tripa',p:3.50,ok:false},{n:'Taco de nopal',p:2.75,ok:true}]},
 {c:'De la casa',ex:EX,q:QT,at:AT_T,nt:NT_COMIDA,it:[
  {n:'Quesabirria (3 pzas)',p:13.50,ok:true},{n:'Mulita de asada',p:6.50,ok:true},
  {n:'Vampiro',p:5.75,ok:true}]},
 {c:'Tortas y burritos',ex:EX,q:QB,at:AT_B,nt:NT_COMIDA,it:[
  {n:'Torta de milanesa',p:12.00,ok:true},{n:'Torta ahogada',p:11.50,ok:true},
  {n:'Burrito de asada',p:11.00,ok:true}]},
 {c:'Antojitos',ex:null,q:null,nt:NT_ANTOJO,it:[
  {n:'Elote entero',p:4.50,ok:true},{n:'Esquites',p:5.00,ok:true},
  {n:'Papas con queso',p:8.50,ok:true},{n:'Consomé de birria',p:4.00,ok:true}]},
 {c:'Bebidas',ex:null,q:null,nt:NT_BEBIDA,it:[
  {n:'Agua de horchata',p:3.50,ok:true},{n:'Agua de jamaica',p:3.50,ok:true},
  {n:'Jarritos',p:2.75,ok:true},{n:'Coca de vidrio',p:3.25,ok:true}]}
];
const TAX=0.08625;

const NEXT={nueva:'prep',prep:'lista',lista:null};
const PREV={prep:'nueva',lista:'prep'};
const CTA={nueva:'Empezar',prep:'Lista',lista:'Entregada'};

/* ============ umbrales: los define el dueño desde su panel ============ */
const CONFIG={amber:8,red:15};                 // minutos en preparación
const nuevaA=()=>Math.max(1,Math.round(CONFIG.amber/2));
const nuevaR=()=>Math.max(2,Math.round(CONFIG.red/2));

function level(o){
  if(o.s==='lista')return 'green';
  const min=(now()-o.t+offset)/M;
  if(o.s==='nueva')return min>=nuevaR()?'red':(min>=nuevaA()?'amber':'nueva');
  return min>=CONFIG.red?'red':(min>=CONFIG.amber?'amber':'');
}
const mins=o=>{const m=Math.floor((now()-o.t+offset)/M);return m<1?'ahora':m+' min'};

/* ============ pintado ============ */
function draw(pop){
  document.getElementById('cntN').textContent=DIA.ordenes;   /* ritmo a la vista, sin dinero */
  ['nueva','prep','lista'].forEach(s=>{
    const list=ORD.filter(o=>o.s===s).sort((a,b)=>a.t-b.t);
    const el=document.getElementById('c-'+s);
    document.querySelector('.col[data-s='+s+'] .n').textContent=list.length;
    if(!list.length){el.innerHTML='<div class="empty">'+
      (s==='nueva'?'Sin pedidos nuevos':s==='prep'?'Nada en preparación':'Nada listo por entregar')+'</div>';return}
    el.innerHTML=list.map(o=>{
      const lv=level(o);
      return '<article class="card '+lv+(pop===o.n?' pop':'')+'">'+
        '<div class="top"><span class="num">#'+o.n+'</span><span class="age">'+mins(o)+'</span>'+
          (PREV[o.s]?'<button class="back" data-back="'+o.n+'" aria-label="Regresar">←</button>':'')+'</div>'+
        '<div class="meta">'+o.quien+'<span class="ch">'+o.canal+'</span></div>'+
        (!o.pagado&&o.s!=='lista'?'<div class="unpaid">Por cobrar</div>':'')+
        '<ul class="items">'+o.items.map(i=>
          '<li><span class="q">'+i.q+'</span><span><span class="nm">'+i.nm+'</span>'+
          ((i.add||i.rm)?'<span class="mods">'+
            (i.add||[]).map(a=>'<span class="mod add">+ '+a+'</span>').join('')+
            (i.rm||[]).map(r=>'<span class="mod rm">Sin '+r.toLowerCase()+'</span>').join('')+
          '</span>':'')+
          (i.nota?'<span class="inota">“'+i.nota+'”</span>':'')+'</span></li>').join('')+'</ul>'+
        (o.nota?'<div class="note">'+o.nota+'</div>':'')+
        (o.s==='lista'?'<div class="pay'+(o.pagado?' paid':'')+'"><small>'+
          (o.pagado?'Pagado':'Cobrar')+'</small><span>$'+o.total.toFixed(2)+'</span></div>':'')+
        '<button class="go" data-go="'+o.n+'">'+CTA[o.s]+'</button>'+
      '</article>'}).join('');
  });
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>advance(+b.dataset.go,1));
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>advance(+b.dataset.back,-1));
}

/* ============ un solo toque ============ */
function advance(n,dir){
  const o=ORD.find(x=>x.n===n);if(!o)return;
  const to=dir>0?NEXT[o.s]:PREV[o.s];
  /* entregar: si está pagada es un solo toque; si no, se pregunta, porque ahí cambia el dinero */
  if(dir>0&&!to)return o.pagado?deliver(o,true):askPay(o);
  o.s=to;
  publicarEstado(o,o.s);
  if(!online){pending++;showQueue()}
  draw();
}
function deliver(o,cobrada){
  o.pagado=cobrada;
  publicarEstado(o,'entregada');
  ORD.splice(ORD.indexOf(o),1);
  DIA.ordenes++;
  o.items.forEach(i=>DIA.platillos[i.nm]=(DIA.platillos[i.nm]||0)+i.q);
  if(cobrada){DIA.cobradas++;DIA.venta+=o.total}
  else{DIA.sinCobrar++;toast('Entregada sin cobrar · queda registrada')}
  if(!online){pending++;showQueue()}
  draw();
}
function askPay(o){
  const a=document.getElementById('ask'),amt='$'+o.total.toFixed(2);
  a.innerHTML='<div class="askbox" role="dialog" aria-modal="true">'+
    '<div class="h">Orden #'+o.n+' · '+o.quien+'</div>'+
    '<h3>¿Ya cobraste esta orden?</h3>'+
    '<div class="amt">'+amt+'</div>'+
    '<button class="yes" id="aY">Sí, cobré '+amt+'</button>'+
    '<button class="no" id="aN">Entregar sin cobrar</button>'+
    '<button class="cancel" id="aC">Cancelar</button></div>';
  a.classList.add('on');
  document.getElementById('aY').focus();
  document.getElementById('aY').onclick=()=>{a.classList.remove('on');deliver(o,true)};
  document.getElementById('aN').onclick=()=>{a.classList.remove('on');deliver(o,false)};
  document.getElementById('aC').onclick=()=>a.classList.remove('on');
}
/* ============ ventas del turno: se abre a propósito, no vive encima del tablero ============ */
function openDay(){
  const porCobrar=ORD.filter(o=>!o.pagado).length;
  const tk=DIA.cobradas?DIA.venta/DIA.cobradas:0;
  const top=Object.entries(DIA.platillos).sort((a,b)=>b[1]-a[1]).slice(0,5);
  document.getElementById('day').innerHTML='<div class="daybox" role="dialog" aria-modal="true">'+
    '<div class="hd"><h3>Cómo va el día</h3><span>Truck 1 · desde que abrió</span></div>'+
    '<div class="nums">'+
      '<div><b>'+DIA.ordenes+'</b><span>Órdenes entregadas</span></div>'+
      '<div><b>$'+DIA.venta.toFixed(2)+'</b><span>Cobrado hoy</span></div>'+
      '<div><b>$'+tk.toFixed(2)+'</b><span>Ticket promedio</span></div>'+
      '<div'+(porCobrar?' class="warn"':'')+'><b>'+porCobrar+'</b><span>Abiertas por cobrar</span></div>'+
    '</div>'+
    '<div class="dtop"><h4>Lo que más ha salido</h4>'+
      top.map(([n,q])=>'<div class="p"><span>'+n+'</span><em>'+q+'</em></div>').join('')+
    '</div>'+
    (DIA.sinCobrar?'<p class="disc">'+DIA.sinCobrar+' orden'+(DIA.sinCobrar>1?'es':'')+
      ' se entregó sin cobrar. Queda registrado y el dueño lo ve en su panel.</p>':'')+
    '<button class="close" id="dX">Volver a las órdenes</button>'+
    '<p class="disc">Es la venta del truck en el día, no de cada persona.</p>'+
  '</div>';
  document.getElementById('day').classList.add('on');
  document.getElementById('dX').onclick=closeDay;
  document.getElementById('dX').focus();
}
function closeDay(){document.getElementById('day').classList.remove('on')}

let tt;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){
  document.getElementById('ask').classList.remove('on');closeDay()}});

/* ============ sonido de pedido nuevo ============ */
let ac;
function beep(){
  if(!snd)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    [0,.18].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=i?1046:784;
      const t=ac.currentTime+d;g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.25,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+.30);
      o.start(t);o.stop(t+.32)})}catch(e){}
}

/* ============ conexión ============ */
function showQueue(){
  const q=document.getElementById('queue');
  if(!online&&pending){q.textContent='Sin conexión · '+pending+' cambio'+(pending>1?'s':'')+' en espera';q.classList.add('on')}
  else q.classList.remove('on');
}
document.getElementById('red').onclick=()=>{
  online=!online;
  const c=document.getElementById('conn');
  c.classList.toggle('off',!online);
  document.getElementById('connTxt').textContent=online?'En línea':'Sin conexión';
  document.getElementById('red').textContent=online?'Cortar conexión':'Restablecer conexión';
  if(online&&pending){pending=0;showQueue();draw()}else showQueue();
};

/* ============ controles ============ */
const NUEVOS=[

 {quien:'Mostrador',canal:'Ventanilla',total:16.25,items:[{q:1,nm:'Torta de milanesa',rm:['Jalapeño']},{q:1,nm:'Esquites'}],nota:'Para llevar'},
 {quien:'Diego',canal:'QR',total:13.50,items:[{q:1,nm:'Quesabirria (3 pzas)',add:['Doble carne','Aguacate']}]}
];

document.getElementById('simular').onclick=()=>{

/* ============ marcar agotado ============ */
let agCat=0;
function drawAgot(){
  const c=MENU[agCat], falta=MENU.flatMap(x=>x.it).filter(i=>!i.ok).length;
  document.getElementById('agHint').textContent=falta
    ? falta+(falta>1?' platillos están agotados':' platillo está agotado')+' · tus clientes no los ven'
    : 'Todo disponible. Apaga lo que se acabe y desaparece del menú al instante.';
  document.getElementById('agChips').innerHTML=MENU.map((x,i)=>
    '<button data-c="'+i+'"'+(i===agCat?' aria-current="true"':'')+'>'+x.c+
    (x.it.some(i2=>!i2.ok)?' ·':'')+'</button>').join('');
  document.getElementById('agList').innerHTML=c.it.map((i,j)=>
    '<div class="arow'+(i.ok?'':' off')+'"><div class="nm"><b>'+i.n+'</b>'+
    '<span>'+(i.ok?'Se está vendiendo':'No aparece en el menú')+'</span></div>'+
    '<button class="sw" role="switch" aria-checked="'+i.ok+'" aria-label="'+i.n+'" data-t="'+j+'"><i></i></button></div>').join('');
  document.getElementById('agChips').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{agCat=+b.dataset.c;drawAgot()});
  document.getElementById('agList').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    const i=c.it[+b.dataset.t];i.ok=!i.ok;drawAgot();
    toast(i.ok?i.n+' vuelve a aparecer en el menú':'Se acabó '+i.n.toLowerCase()+' · ya no aparece en el menú')});
}
function openAgot(){
  document.getElementById('agotados').innerHTML=
    '<div class="fhd"><div><h2>¿Qué se acabó?</h2></div>'+
    '<button class="fx" id="agX">Volver a las órdenes</button>'+
    '<p id="agHint"></p></div>'+
    '<div class="chips" id="agChips"></div>'+
    '<div class="fbody"><div id="agList"></div></div>';
  document.getElementById('agotados').classList.add('on');
  document.getElementById('agX').onclick=()=>document.getElementById('agotados').classList.remove('on');
  drawAgot();
}

/* ============ pedido en ventanilla ============ */
let cpCat=0, cpLin=[], cpPag=null, cpEdit=null, cpNota={ch:new Set(),txt:''};
const nombreCorto=n=>n.replace(/\s*\(.*\)/,'');
function cpTotal(){return cpLin.reduce((s,l)=>s+l.q*(l.p+l.add.reduce((a,e)=>a+e[1],0)),0)}

/* ---- notas ----
   Las notas de una taquería casi siempre son las mismas. Un toque cubre la mayoría,
   escribir queda de respaldo, y el dictado es un extra: necesita señal y ambiente
   silencioso, así que nunca puede ser el único camino. */
/* Solo cosas que aplican a TODA la orden. Lo que describe un platillo
   (sin picante, con todo) vive en cada línea, no aquí — si no, la cocina
   no sabría a cuál de los platillos aplica. Los que comparten grupo `g`
   se excluyen entre sí. */
const NOTA_ORDEN=[{t:'Para llevar',g:'d'},{t:'Para comer aquí',g:'d'},
                  {t:'Todo junto'},{t:'Cubiertos extra'}];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'+
  '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';

function notaHTML(id,chips,st,ph){
  return '<div class="lb"><b>Nota</b> <span>toca lo común o escríbela</span></div>'+
    '<div class="qchips" id="'+id+'c">'+chips.map((c,i)=>
      '<button data-n="'+i+'" aria-pressed="'+st.ch.has(c.t)+'">'+c.t+'</button>').join('')+'</div>'+
    '<div class="nwrap"><textarea id="'+id+'t" placeholder="'+ph+'" rows="2">'+st.txt+'</textarea>'+
      (SR?'<button class="mic" id="'+id+'m" aria-label="Dictar la nota" title="Dictar">'+MIC+'</button>':'')+
    '</div><p class="mhint" id="'+id+'h">'+(SR?'':'Este aparato no puede dictar. Usa los botones o escribe.')+'</p>';
}
function notaWire(id,chips,st,after){
  const ta=document.getElementById(id+'t'), hint=document.getElementById(id+'h');
  const cont=document.getElementById(id+'c');
  cont.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
    const c=chips[+b.dataset.n];
    if(st.ch.has(c.t))st.ch.delete(c.t);
    else{
      if(c.g)chips.forEach(o=>{if(o.g===c.g)st.ch.delete(o.t)});   /* mismo grupo = se excluyen */
      st.ch.add(c.t);
    }
    cont.querySelectorAll('[data-n]').forEach(x=>
      x.setAttribute('aria-pressed',st.ch.has(chips[+x.dataset.n].t)));
    after&&after()});
  ta.oninput=()=>{st.txt=ta.value;after&&after()};
  const mb=document.getElementById(id+'m');
  if(mb)mb.onclick=()=>{
    const r=new SR();r.lang='es-MX';r.interimResults=false;r.maxAlternatives=1;
    mb.classList.add('rec');hint.classList.remove('err');hint.textContent='Escuchando… habla normal.';
    r.onresult=e=>{const t=e.results[0][0].transcript.trim();
      ta.value=(ta.value?ta.value+' ':'')+t;st.txt=ta.value;hint.textContent='Listo. Revísalo antes de mandar.';after&&after()};
    r.onerror=e=>{mb.classList.remove('rec');hint.classList.add('err');
      hint.textContent=e.error==='not-allowed'?'No diste permiso al micrófono.'
        :e.error==='no-speech'?'No escuché nada. Intenta otra vez o usa los botones.'
        :e.error==='network'?'Sin internet no se puede dictar. Escribe la nota.'
        :'No se pudo dictar aquí. Escribe la nota.'};
    r.onend=()=>mb.classList.remove('rec');
    try{r.start()}catch(err){mb.classList.remove('rec');hint.classList.add('err');
      hint.textContent='No se pudo abrir el micrófono.'}};
}
const notaTexto=st=>[...st.ch,st.txt.trim()].filter(Boolean).join(' · ');
function drawCap(){
  const c=MENU[cpCat];
  document.getElementById('cpChips').innerHTML=MENU.map((x,i)=>
    '<button data-c="'+i+'"'+(i===cpCat?' aria-current="true"':'')+'>'+x.c+'</button>').join('');
  document.getElementById('cpProds').innerHTML=c.it.map((i,j)=>{
    const en=cpLin.filter(l=>l.n===i.n).reduce((s,l)=>s+l.q,0);
    return '<button class="p" data-a="'+j+'"'+(i.ok?'':' disabled')+'>'+
      '<b>'+i.n+(en?'<span class="pq">'+en+'</span>':'')+'</b>'+
      '<span>'+(i.ok?'$'+i.p.toFixed(2):'Se acabó')+'</span></button>'}).join('');
  document.getElementById('cpTick').innerHTML=cpLin.length?cpLin.map((l,k)=>
    '<div class="tl"><div class="qn">'+l.q+'</div><div>'+
      '<div class="tn">'+l.n+'</div>'+
      ((l.add.length||l.rm.length)?'<div class="tm">'+
        l.add.map(e=>'<span class="a">+ '+e[0]+'</span>').join('')+
        l.rm.map(r=>'<span class="r">Sin '+r.toLowerCase()+'</span>').join('')+'</div>':'')+
      (l.nota?'<div class="tnota">“'+l.nota+'”</div>':'')+
      '<div class="tb"><button data-m="'+k+'">−</button><button data-p="'+k+'">+</button>'+
        '<button data-e="'+k+'">'+((l.add.length||l.rm.length||l.nota)?'Cambios':'+ Nota')+'</button>'+
        '<button data-x="'+k+'">Quitar</button></div>'+
    '</div><div class="tp">$'+(l.q*(l.p+l.add.reduce((a,e)=>a+e[1],0))).toFixed(2)+'</div></div>').join('')
    : '<div class="tempty">Toca los platillos de la izquierda para armar el pedido.</div>';
  const t=cpTotal();
  document.getElementById('cpTot').innerHTML='<span>Total<small>Con impuesto: $'+(t*(1+TAX)).toFixed(2)+'</small></span>'+
    '<span>$'+t.toFixed(2)+'</span>';
  document.getElementById('cpSend').disabled=!cpLin.length||cpPag===null;   /* false = paga al recoger, sí es válido */
  document.getElementById('cpChips').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cpCat=+b.dataset.c;drawCap()});
  document.getElementById('cpProds').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const i=c.it[+b.dataset.a], ya=cpLin.find(l=>l.n===i.n&&!l.add.length&&!l.rm.length);
    if(ya)ya.q++;
    else cpLin.push({n:i.n,p:i.p,q:1,add:[],rm:[],nota:'',note:{ch:new Set(),txt:''},
                     can:true,ex:c.ex,qq:c.q,at:c.at,nt:c.nt||NT_COMIDA});
    drawCap()});
  document.getElementById('cpTick').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cpLin[+b.dataset.p].q++;drawCap()});
  document.getElementById('cpTick').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const l=cpLin[+b.dataset.m];l.q--;if(l.q<1)cpLin.splice(cpLin.indexOf(l),1);drawCap()});
  document.getElementById('cpTick').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{cpLin.splice(+b.dataset.x,1);drawCap()});
  document.getElementById('cpTick').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editLin(+b.dataset.e));
}
function editLin(k){
  const l=cpLin[k];cpEdit=k;
  const add=new Set(l.add.map(e=>e[0])), rm=new Set(l.rm);
  const html='<div class="askbox" role="dialog" aria-modal="true">'+
    '<div class="h">'+l.n+'</div><h3 style="margin-bottom:16px">¿Algún cambio?</h3>'+
    (l.ex?'<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;margin-bottom:9px">Agregar</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px">'+l.ex.map((e,j)=>
      '<button class="opt" data-ea="'+j+'" aria-pressed="'+add.has(e[0])+'">'+e[0]+
      (e[1]?' <small style="display:inline;opacity:.75">+$'+e[1].toFixed(2)+'</small>':'')+'</button>').join('')+'</div></div>':'')+
    (l.qq?'<div style="margin-bottom:16px"><div style="font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;margin-bottom:9px">Ingredientes</div>'+
      '<div id="liQ"></div></div>':'')+
    '<div class="notes" style="border:0;padding:0;margin-bottom:16px">'+
      notaHTML('li',l.nt,l.note,'Algo más de este platillo')+'</div>'+
    '<button class="yes" id="eOK">Listo</button></div>';
  const a=document.getElementById('ask');a.innerHTML=html;a.classList.add('on');
  a.querySelectorAll('[data-ea]').forEach(b=>b.onclick=()=>{
    const e=l.ex[+b.dataset.ea];add.has(e[0])?add.delete(e[0]):add.add(e[0]);
    b.setAttribute('aria-pressed',add.has(e[0]))});
  /* Los atajos escriben en la misma lista de quitables. Por construcción no puede
     quedar "Con todo" y "Sin picante" marcados a la vez. */
  function pintaQuita(){
    const cq=document.getElementById('liQ');if(!cq)return;
    const act=at=>at.q.length?at.q.every(x=>rm.has(x)):rm.size===0;
    cq.innerHTML=(l.at?'<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">'+
        l.at.map((at,j)=>'<button class="opt" data-at="'+j+'" aria-pressed="'+act(at)+'" '+
        'style="font-weight:800">'+at.t+'</button>').join('')+'</div>':'')+
      '<div style="display:flex;flex-wrap:wrap;gap:8px">'+l.qq.map((r,j)=>
        '<button class="opt" data-er="'+j+'" aria-pressed="'+rm.has(r)+'">Sin '+r.toLowerCase()+'</button>').join('')+'</div>';
    cq.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{
      const at=l.at[+b.dataset.at];
      if(!at.q.length)rm.clear();                       /* "Con todo" limpia todo */
      else if(at.q.every(x=>rm.has(x)))at.q.forEach(x=>rm.delete(x));
      else at.q.forEach(x=>rm.add(x));
      pintaQuita()});
    cq.querySelectorAll('[data-er]').forEach(b=>b.onclick=()=>{
      const r=l.qq[+b.dataset.er];rm.has(r)?rm.delete(r):rm.add(r);pintaQuita()});
  }
  pintaQuita();
  notaWire('li',l.nt,l.note);
  document.getElementById('eOK').onclick=()=>{
    l.add=(l.ex||[]).filter(e=>add.has(e[0]));l.rm=[...rm];l.nota=notaTexto(l.note);
    a.classList.remove('on');drawCap()};
}
function openCap(){
  cpLin=[];cpPag=null;cpCat=0;cpNota={ch:new Set(),txt:''};
  document.getElementById('captura').innerHTML=
    '<div class="fhd"><div><h2>Pedido en ventanilla</h2></div>'+
    '<button class="fx" id="cpX">Cancelar</button>'+
    '<p>Para quien llegó sin celular. Entra al mismo tablero y al mismo registro de ventas.</p></div>'+
    '<div class="chips" id="cpChips"></div>'+
    '<div class="cap"><div class="capl"><div class="prods" id="cpProds"></div></div>'+
    '<div class="capr"><div class="tick" id="cpTick"></div>'+
      '<div class="notes" id="cpN"></div>'+
      '<div class="capf"><div class="tot" id="cpTot"></div>'+
      '<div class="pay2" id="cpPay"><button data-y="1">Ya pagó</button><button data-y="0">Paga al recoger</button></div>'+
      '<button class="send" id="cpSend" disabled>Mandar a cocina</button></div></div></div>';
  document.getElementById('captura').classList.add('on');
  document.getElementById('cpX').onclick=()=>document.getElementById('captura').classList.remove('on');
  document.getElementById('cpPay').querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{
    cpPag=b.dataset.y==='1';
    document.getElementById('cpPay').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    drawCap()});
  document.getElementById('cpN').innerHTML=notaHTML('cn',NOTA_ORDEN,cpNota,'Algo más que deba saber la cocina');
  notaWire('cn',NOTA_ORDEN,cpNota);
  document.getElementById('cpSend').onclick=()=>{
    const o={n:folioNuevo(),canal:'Ventanilla',quien:'Mostrador',t:now()-offset,s:'nueva',pagado:cpPag,
      total:cpTotal()*(1+TAX),nota:notaTexto(cpNota)||null,
      items:cpLin.map(l=>({q:l.q,nm:nombreCorto(l.n),add:l.add.map(e=>e[0]),rm:l.rm,nota:l.nota||null}))};
    ORD.push(o);document.getElementById('captura').classList.remove('on');draw(o.n);
    document.querySelector('[data-t=nueva]')?.click();
    toast('Orden #'+o.n+' mandada a cocina'+(cpPag?' · ya pagada':' · cobrar al entregar'))};
  drawCap();
}

document.getElementById('agot').onclick=openAgot;
document.getElementById('cap').onclick=openCap;
document.getElementById('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.col').forEach(c=>c.classList.toggle('show',c.dataset.s===b.dataset.t));
  document.getElementById('tabs').querySelectorAll('button').forEach(x=>x.setAttribute('aria-current',x===b))});

/* ============ la pantalla no se duerme ============ */
(async()=>{try{await navigator.wakeLock.request('screen')}catch(e){}})();

document.getElementById('snd').classList.add('on');
draw();
/* ============ pedidos que llegan del menú del comensal ============
   El menú y esta pantalla son archivos separados: no comparten variables
   ni memoria. El puente es localStorage, que sí cruza pestañas del MISMO
   navegador — a diferencia de abrir dos archivos por separado, que
   comprobamos que NO comparte almacenamiento. Cuando exista el backend
   real esto lo hace Realtime; aquí es la mejor aproximación sin él. */
function revisarCola(){
  let cola;
  try{cola=JSON.parse(localStorage.getItem('ftCola')||'[]')}catch(e){return}
  if(!cola.length)return;
  let llego=false;
  cola.forEach(n=>{
    if(ORD.some(o=>o.n===n))return;               /* ya la tenemos, no duplicar */
    let snap;
    try{snap=JSON.parse(localStorage.getItem('ftPedido_'+n))}catch(e){return}
    if(!snap)return;
    ORD.push({n:snap.n,canal:'QR',quien:snap.cliente||'Cliente',t:now()-offset,
      s:'nueva',pagado:!!snap.pagado,total:snap.sub*(1+snap.tax),nota:null,
      items:(snap.items||[]).map(i=>({q:i.q,nm:i.n,add:i.add||[],rm:i.rm||[],nota:i.nota||null}))});
    llego=true;
  });
  try{localStorage.removeItem('ftCola')}catch(e){}
  if(llego){beep();closeDay();draw();document.querySelector('[data-t=nueva]')?.click();
    toast('Llegó un pedido nuevo del menú')}
}
window.addEventListener('storage',e=>{if(e.key==='ftCola')revisarCola()});
document.getElementById('revisarMenu').onclick=()=>{revisarCola();toast('Revisado')};
setInterval(revisarCola,4000);
revisarCola();

setInterval(draw,1000);
</script>
