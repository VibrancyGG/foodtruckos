<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B · Ventanilla — Pavessa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#D62828;
  --on-primary:#fff;
  --ink:#14110F;
  --ink-soft:#736A63;
  --panel:#FFFFFF;
  --line:#EAE5DF;
  --sold:#A79E96;
  --display:'Archivo Black',system-ui,sans-serif;
  --body:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#E8E3DC;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ---------- barra de prueba (no es parte del producto) ---------- */
.lab{position:sticky;top:0;z-index:60;background:#1D1D1F;color:#EDEDEF;font:500 12px/1.4 var(--body);padding:8px 12px}
.lab-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:900px;margin:0 auto}
.lab b{font-weight:700;letter-spacing:.02em}
.lab-tag{background:#3A3A3E;padding:2px 7px;border-radius:3px;font-size:11px}
.sw{display:flex;gap:5px}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw button[aria-pressed=true]{border-color:#fff}
.lab select,.lab a,.lab .ghost{background:#3A3A3E;color:#EDEDEF;border:0;border-radius:4px;padding:4px 8px;font:500 12px var(--body);cursor:pointer;text-decoration:none}
.lab .ratio{margin-left:auto;font-variant-numeric:tabular-nums}
.lab .ok{color:#7CE38B}.lab .bad{color:#FF8A80}
body.clean .lab{display:none}

.phone{max-width:430px;margin:0 auto;background:var(--panel);min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.14)}

/* ---------- encabezado: aire y una regla ---------- */
.top{padding:26px 22px 20px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-family:var(--display);font-size:17px;display:grid;place-items:center;letter-spacing:-.02em}
.bname{font-family:var(--display);font-size:27px;line-height:1.04;letter-spacing:-.025em;margin:15px 0 0}
.bsub{font-size:13.5px;color:var(--ink-soft);margin:7px 0 0;font-weight:500}
.state{display:inline-flex;align-items:center;gap:7px;margin-top:15px;border:1.5px solid var(--line);border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:#22A24C}

/* ---------- categoría ---------- */
.cat{display:flex;align-items:center;gap:12px;padding:26px 22px 6px}
.cat h2{font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:0}
.cat i{flex:1;height:3px;background:var(--primary);border-radius:2px}

/* ---------- tarjeta de platillo ---------- */
.card{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 22px 26px;font:inherit;color:inherit;cursor:pointer}
.card:focus-visible{outline:3px solid var(--primary);outline-offset:-4px}
.frame{display:block;position:relative}
.shot{display:block;position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--primary)}
.shot::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 22% 12%,rgba(255,255,255,.30),transparent 62%)}
.shot::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(122deg,rgba(0,0,0,.10) 0 2px,transparent 2px 15px)}
.pend{position:absolute;left:14px;top:14px;z-index:2;background:rgba(0,0,0,.32);color:#fff;font-size:11px;font-weight:600;letter-spacing:.03em;padding:5px 10px;border-radius:100px;backdrop-filter:blur(3px)}
.stamp{position:absolute;right:14px;bottom:-18px;z-index:3;width:74px;height:74px;border-radius:50%;background:var(--panel);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:19px;letter-spacing:-.03em;box-shadow:0 6px 18px rgba(20,17,15,.20)}
.cname{display:block;font-family:var(--display);font-size:25px;line-height:1.06;letter-spacing:-.025em;margin:26px 0 0;padding-right:70px}
.cdesc{display:block;font-size:14.5px;line-height:1.5;color:var(--ink-soft);margin:9px 0 0}
.cta{margin-top:15px;display:inline-flex;align-items:center;gap:9px;background:var(--primary);color:var(--on-primary);border-radius:100px;padding:12px 22px;font-family:var(--display);font-size:14px;letter-spacing:.02em}
.card.out{opacity:1}
.card.out .shot{background:var(--sold);filter:saturate(.25)}
.card.out .stamp{color:var(--sold)}
.card.out .cname{color:var(--sold)}
.band{position:absolute;inset:auto 0 0;z-index:2;background:var(--ink);color:#fff;text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:9px}
.card.out .cta{background:var(--line);color:var(--ink-soft)}

.foot{padding:12px 22px 120px;text-align:center;color:var(--ink-soft);font-size:12px}
.foot .made{opacity:.55;margin-top:6px;font-size:11px}

/* ---------- barra de pedido ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:430px;margin:0 auto;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--panel) 62%,rgba(255,255,255,0))}
.bar button{width:100%;border:0;border-radius:100px;background:var(--ink);color:#fff;font-family:var(--display);font-size:15.5px;letter-spacing:.02em;padding:17px 22px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.bar button:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.bar .n{background:var(--primary);color:var(--on-primary);border-radius:100px;padding:3px 12px}
.bar[hidden]{display:none}

/* ---------- hoja ---------- */
.veil{position:fixed;inset:0;background:rgba(20,17,15,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .18s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;max-width:430px;margin:0 auto;background:var(--panel);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:11px auto 0}
.sheet-hd{padding:16px 22px 4px}
.sheet-hd h2{font-family:var(--display);font-size:25px;letter-spacing:-.025em;margin:0;line-height:1.06}
.sheet-hd p{margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--ink-soft)}
.step{padding:20px 22px;border-top:1px solid var(--line)}
.step h3{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 13px;color:var(--ink-soft)}
.opts{display:flex;flex-wrap:wrap;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--panel);border-radius:100px;padding:12px 18px;font:600 14.5px var(--body);color:var(--ink);cursor:pointer;min-height:48px}
.opt[aria-pressed=true]{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.opt:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.opt small{display:block;font-weight:500;opacity:.8;font-size:12px;margin-top:1px}
.qty{display:flex;align-items:center;gap:18px}
.qty button{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-family:var(--display);font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}
.qty output{font-family:var(--display);font-size:28px;min-width:40px;text-align:center;letter-spacing:-.03em}
.note{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px;font:500 14.5px var(--body);min-height:62px;resize:vertical;color:var(--ink)}
.note:focus-visible{outline:3px solid var(--primary);outline-offset:1px}
.sheet-ft{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:14px 22px calc(14px + env(safe-area-inset-bottom));display:flex;gap:11px}
.sheet-ft .cancel{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:100px;padding:0 20px;font:600 14.5px var(--body);cursor:pointer;color:var(--ink-soft)}
.sheet-ft .add{flex:1;border:0;border-radius:100px;background:var(--primary);color:var(--on-primary);font-family:var(--display);font-size:15px;letter-spacing:.02em;padding:17px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="lab">
  <div class="lab-row">
    <b>B · Ventanilla</b><span class="lab-tag" id="tagName">Rojo chile</span>
    <div class="sw" id="sw" role="group" aria-label="Paleta"></div>
    <button class="ghost" id="lang">EN</button>
    <a href="index.html">← Todas</a>
    <button class="ghost" id="hide">Ocultar</button>
    <span class="ratio" id="ratio"></span>
  </div>
</div>

<div class="phone">
  <header class="top">
    <div class="mark">EF</div>
    <h1 class="bname">Taquería El Farol</h1>
    <p class="bsub" id="truck">Truck 1 · Main &amp; Porter</p>
    <div class="state"><span class="dot"></span><span id="hours">Abierto · cierra 9:00 pm</span></div>
  </header>
  <main id="menu"></main>
  <footer class="foot">
    <div id="taxline">Los precios no incluyen impuesto (8.625%)</div>
    <div class="made">Pavessa</div>
  </footer>
</div>

<div class="bar" id="bar" hidden>
  <button id="barBtn"><span id="barTxt">Ver pedido</span><span class="n" id="barN">0</span></button>
</div>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shName"></div>

<script>
const PALETTE=[
 {es:'Rojo chile',en:'Chile red',hex:'#D62828'},
 {es:'Naranja trompo',en:'Trompo orange',hex:'#F4661B'},
 {es:'Amarillo maíz',en:'Corn yellow',hex:'#F2A413'},
 {es:'Verde nopal',en:'Nopal green',hex:'#257B4B'},
 {es:'Verde limón',en:'Lime green',hex:'#7CB518'},
 {es:'Turquesa',en:'Turquoise',hex:'#0C7979'},
 {es:'Azul talavera',en:'Talavera blue',hex:'#1F5FBF'},
 {es:'Morado jamaica',en:'Jamaica purple',hex:'#7B2D8E'},
 {es:'Rosa mexicano',en:'Mexican pink',hex:'#D11072'},
 {es:'Café mole',en:'Mole brown',hex:'#8A3B12'}
];
const INK='#14110F';
const lum=h=>{const c=h.slice(1).match(/../g).map(x=>{const v=parseInt(x,16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const ratio=(a,b)=>{const A=lum(a),B=lum(b);return (Math.max(A,B)+.05)/(Math.min(A,B)+.05)};
const onColor=h=>ratio(h,'#FFFFFF')>=ratio(h,INK)?'#FFFFFF':INK;

const EXTRAS=[['Queso','Cheese',1],['Aguacate','Avocado',1.5],['Doble carne','Double meat',2.5],['Salsa de la casa','House salsa',0]];
const QT=[['Cebolla','Onion'],['Cilantro','Cilantro'],['Limón','Lime']];
const QB=[['Jalapeño','Jalapeño'],['Aguacate','Avocado'],['Frijoles','Beans'],['Crema','Crema']];
const MENU=[
{es:'Tacos',en:'Tacos',ex:EXTRAS,q:QT,items:[
 ['Al pastor','Al pastor',3.25,'Del trompo, marinado 24 horas en guajillo y achiote. Con piña asada.','Off the spit, 24-hour guajillo and achiote marinade. Grilled pineapple.'],
 ['Asada','Asada',3.50,'Res al carbón, picada gruesa para que se sienta.','Charcoal beef, chopped coarse so you can feel it.'],
 ['Chorizo','Chorizo',3.00,'Hecho en casa, con papa cuando la hay.','House-made, with potato when we have it.'],
 ['Lengua','Lengua',3.75,'Cocida seis horas hasta que se deshace.','Six hours until it falls apart.'],
 ['Tripa','Tripa',3.50,'Bien dorada. Si la pide blanda, avísele a Beto.','Crisped hard. If you want it soft, tell Beto.',1],
 ['Nopal','Nopal',2.75,'Nopal asado con cebolla cambray. Sin carne.','Grilled cactus with spring onion. No meat.']]},
{es:'De la casa',en:'House specials',ex:EXTRAS,q:QT,items:[
 ['Quesabirria (3 pzas)','Quesabirria (3 pcs)',13.50,'Tortilla sumergida en el consomé y dorada con queso. Va con su vasito para mojar.','Tortillas dipped in consommé and crisped with cheese. Comes with a cup for dipping.'],
 ['Mulita de asada','Asada mulita',6.50,'Dos tortillas, queso derretido en medio, carne al carbón.','Two tortillas, melted cheese between, charcoal beef.'],
 ['Vampiro','Vampiro',5.75,'Tortilla tatemada hasta quedar tostada, queso y la carne que elija.','Tortilla charred until crisp, cheese, and the meat you pick.']]},
{es:'Tortas y burritos',en:'Tortas & burritos',ex:EXTRAS,q:QB,items:[
 ['Torta de milanesa','Milanesa torta',12.00,'Pan telera, milanesa de res, aguacate, frijoles, jalapeño.','Telera roll, breaded beef, avocado, beans, jalapeño.'],
 ['Torta ahogada','Torta ahogada',11.50,'Bañada en salsa de chile de árbol. Pida servilletas de más.','Drowned in chile de árbol salsa. Ask for extra napkins.'],
 ['Burrito de asada','Asada burrito',11.00,'Tortilla de harina, arroz, frijol, carne al carbón, guacamole.','Flour tortilla, rice, beans, charcoal beef, guacamole.']]},
{es:'Antojitos',en:'Sides',ex:null,q:null,items:[
 ['Elote entero','Whole elote',4.50,'Mayonesa, queso cotija, chile en polvo y limón.','Mayo, cotija, chile powder and lime.'],
 ['Esquites','Esquites',5.00,'El mismo elote, en vaso, con caldo.','Same elote, in a cup, with broth.'],
 ['Papas con queso','Loaded fries',8.50,'Papa frita, queso, carne al carbón y crema.','Fries, cheese, charcoal beef and crema.'],
 ['Consomé de birria','Birria consommé',4.00,'Un vaso grande. Para el frío o para la cruda.','Large cup. For the cold or for the hangover.']]},
{es:'Bebidas',en:'Drinks',ex:null,q:null,items:[
 ['Agua de horchata','Horchata',3.50,'Arroz y canela, hecha en la mañana.','Rice and cinnamon, made this morning.'],
 ['Agua de jamaica','Jamaica',3.50,'Flor de jamaica, poca azúcar.','Hibiscus, light on the sugar.'],
 ['Jarritos','Jarritos',2.75,'Mandarina, tamarindo o toronja.','Mandarin, tamarind or grapefruit.'],
 ['Coca de vidrio','Mexican Coke',3.25,'De caña. No es lo mismo y usted lo sabe.','Cane sugar. Not the same and you know it.']]}
];

const T={
 es:{hours:'Abierto · cierra 9:00 pm',truck:'Truck 1 · Main & Porter',tax:'Los precios no incluyen impuesto (8.625%)',
     out:'Se nos acabó',bar:'Ver pedido',qty:'¿Cuántos?',extras:'¿Le agregamos algo?',remove:'¿Le quitamos algo?',
     note:'¿Algo más que debamos saber?',notePh:'Ej: sin picante, para llevar',cancel:'Cerrar',add:'Agregar',free:'Sin costo',
     pend:'Foto en camino',pick:'Elegir'},
 en:{hours:'Open · closes 9:00 pm',truck:'Truck 1 · Main & Porter',tax:'Prices do not include tax (8.625%)',
     out:'Sold out',bar:'View order',qty:'How many?',extras:'Add anything?',remove:'Take anything off?',
     note:'Anything else we should know?',notePh:'e.g. no spice, to go',cancel:'Close',add:'Add',free:'Free',
     pend:'Photo coming',pick:'Choose'}
};
let lang='es',cart=0;
const $=s=>document.querySelector(s);
const money=n=>'$'+n.toFixed(2);

function paint(i){
  const p=PALETTE[i],on=onColor(p.hex);
  document.documentElement.style.setProperty('--primary',p.hex);
  document.documentElement.style.setProperty('--on-primary',on);
  $('#tagName').textContent=p[lang];
  const r=ratio(p.hex,on);
  $('#ratio').innerHTML='texto/acento <span class="'+(r>=4.5?'ok':'bad')+'">'+r.toFixed(2)+':1 '+(r>=4.5?'✓':'✕')+'</span>';
  [...$('#sw').children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
}
PALETTE.forEach((p,i)=>{
  const b=document.createElement('button');
  b.style.background=p.hex;b.title=p.es;b.setAttribute('aria-label',p.es);
  b.onclick=()=>paint(i);$('#sw').appendChild(b);
});

function render(){
  const t=T[lang];
  $('#hours').textContent=t.hours;$('#truck').textContent=t.truck;$('#taxline').textContent=t.tax;
  $('#barTxt').textContent=t.bar;
  $('#menu').innerHTML=MENU.map((c,ci)=>
    '<div class="cat"><h2>'+c[lang]+'</h2><i></i></div>'+
    c.items.map((it,ii)=>{
      const out=it[5];
      return '<button class="card'+(out?' out':'')+'" data-c="'+ci+'" data-i="'+ii+'"'+(out?' disabled':'')+'>'+
        '<span class="frame"><span class="shot">'+(out?'<span class="band">'+t.out+'</span>':'<span class="pend">'+t.pend+'</span>')+
        '</span><span class="stamp">'+money(it[2])+'</span></span>'+
        '<span class="cname">'+it[lang==='es'?0:1]+'</span>'+
        '<span class="cdesc">'+it[lang==='es'?3:4]+'</span>'+
        (out?'':'<span class="cta">'+t.pick+'</span>')+'</button>';
    }).join('')
  ).join('');
  $('#menu').querySelectorAll('.card:not(.out)').forEach(b=>b.onclick=()=>openSheet(+b.dataset.c,+b.dataset.i));
}

let q=1,picked=new Set(),removed=new Set(),cur=null;
function openSheet(ci,ii){
  const t=T[lang],c=MENU[ci],it=c.items[ii];cur={c,it};q=1;picked=new Set();removed=new Set();
  $('#sheet').innerHTML=
    '<div class="grab"></div>'+
    '<div class="sheet-hd"><h2 id="shName">'+it[lang==='es'?0:1]+'</h2><p>'+it[lang==='es'?3:4]+'</p></div>'+
    '<div class="step"><h3>'+t.qty+'</h3><div class="qty">'+
      '<button data-q="-1" aria-label="−">−</button><output id="q">1</output><button data-q="1" aria-label="+">+</button></div></div>'+
    (c.ex?'<div class="step"><h3>'+t.extras+'</h3><div class="opts">'+c.ex.map((e,j)=>
      '<button class="opt" data-ex="'+j+'" aria-pressed="false">'+e[lang==='es'?0:1]+
      '<small>'+(e[2]?'+'+money(e[2]):t.free)+'</small></button>').join('')+'</div></div>':'')+
    (c.q?'<div class="step"><h3>'+t.remove+'</h3><div class="opts">'+c.q.map((e,j)=>
      '<button class="opt" data-rm="'+j+'" aria-pressed="false">'+e[lang==='es'?0:1]+'</button>').join('')+'</div></div>':'')+
    '<div class="step"><h3>'+t.note+'</h3><textarea class="note" placeholder="'+t.notePh+'"></textarea></div>'+
    '<div class="sheet-ft"><button class="cancel" id="x">'+t.cancel+'</button>'+
      '<button class="add" id="ok"><span>'+t.add+'</span><span id="tot"></span></button></div>';
  const total=()=>{let s=cur.it[2];picked.forEach(j=>s+=cur.c.ex[j][2]);return s*q};
  const sync=()=>{$('#q').textContent=q;$('#tot').textContent=money(total())};
  $('#sheet').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q=Math.max(1,q+ +b.dataset.q);sync()});
  $('#sheet').querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.ex;picked.has(j)?picked.delete(j):picked.add(j);
    b.setAttribute('aria-pressed',picked.has(j));sync()});
  $('#sheet').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.rm;removed.has(j)?removed.delete(j):removed.add(j);
    b.setAttribute('aria-pressed',removed.has(j))});
  $('#x').onclick=close;
  $('#ok').onclick=()=>{cart+=q;$('#barN').textContent=cart;$('#bar').hidden=false;close()};
  sync();
  $('#veil').classList.add('on');$('#sheet').classList.add('on');
}
function close(){$('#veil').classList.remove('on');$('#sheet').classList.remove('on')}
$('#veil').onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

$('#lang').onclick=()=>{lang=lang==='es'?'en':'es';$('#lang').textContent=lang==='es'?'EN':'ES';
  document.documentElement.lang=lang;render();paint([...$('#sw').children].findIndex(b=>b.getAttribute('aria-pressed')==='true'))};
$('#hide').onclick=()=>document.body.classList.add('clean');
render();paint(0);
</script>
</body>
</html>
